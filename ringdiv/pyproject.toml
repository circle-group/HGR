[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ringdiv"
version = "0.1.0"
description = "A lightweight molecular generation evaluation toolkit"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "dill>=0.3",
    "fcd-torch>=1.0.7",
    "gudhi>=3.9",
    "joblib>=1.2",
    "networkx>=2.8",
    "numpy>=1.23,<3",
    "pandas>=1.5",
    "POT>=0.9",
    "rdkit>=2022.3.5",
    "requests>=2.28",
    "scikit-learn>=1.2",
    "scipy>=1.9",
    "torch>=2.0",
    "tqdm>=4.64",
]

[project.optional-dependencies]
download = ["huggingface-hub>=0.20"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ringdiv*"]
namespaces = true

[tool.setuptools.package-data]
"ringdiv" = ["statics/*", "statics/**/*", "*.pkl.gz", "*.csv"]
